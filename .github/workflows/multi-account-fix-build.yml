name: Multi Account Signed Release Build

on:
  push:
    branches:
      - fix/multi-account-0.2.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multi-account-signed-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  JAVA_DISTRIBUTION: "oracle"
  JAVA_VERSION: "17.0.1"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  PERMANENT_SIGNING_CERT_SHA256: "7490717E45CA309CCD8A5CF7053A469EBFFB1A8C84B537A84B82BA057FB4E963"
  FINAL_APK_NAME: "Sesame-AG-0.2.2-MultiAccount-arm64-v8a.apk"

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate permanent signing secrets
        shell: bash
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${ANDROID_SIGNING_KEY}" ]] || missing+=("ANDROID_SIGNING_KEY")
          [[ -n "${ANDROID_KEY_ALIAS}" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ -n "${ANDROID_KEYSTORE_PASSWORD}" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "${ANDROID_KEY_PASSWORD}" ]] || missing+=("ANDROID_KEY_PASSWORD")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi
          echo "Permanent signing secrets are configured."

      - name: Apply multi-account fix
        shell: bash
        run: |
          set -euo pipefail
          if git apply --check MULTI_ACCOUNT_FIX.patch; then
            git apply MULTI_ACCOUNT_FIX.patch
            echo "Multi-account patch applied."
          elif git apply --reverse --check MULTI_ACCOUNT_FIX.patch; then
            echo "Multi-account patch is already applied."
          else
            echo "Patch cannot be applied cleanly and is not already present."
            exit 1
          fi

      - name: Verify intended source changes
        shell: bash
        run: |
          set -euo pipefail
          TARGET='app/src/main/java/io/github/aoguai/sesameag/hook/AccountSlotRegistry.kt'
          grep -F 'record.activeUserIds.size >= MAX_EXECUTABLE_ACCOUNT_SLOTS' "$TARGET"
          grep -F '!hasVerifiedConfiguredUser(userId)' "$TARGET"
          grep -F 'pendingRuntimeUserId in activeUserIds' "$TARGET"

      - name: Configure arm64-v8a only for CI
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE='app/build.gradle.kts'
          sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("arm64-v8a")/' "$BUILD_FILE"
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' "$BUILD_FILE"
          sed -i '/abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64"))/d' "$BUILD_FILE"
          grep -F 'include("arm64-v8a")' "$BUILD_FILE"
          grep -F 'isUniversalApk = false' "$BUILD_FILE"
          if grep -Fq 'abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64"))' "$BUILD_FILE"; then
            echo "Legacy CI ndk abiFilters are still present."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          architecture: x64
          cache: gradle

      - name: Pin Gradle Java Home
        shell: bash
        run: echo "ORG_GRADLE_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build optimized arm64 release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            :app:assembleRelease \
            -PappVersion=0.2.2-MultiAccount \
            -PofficialSigningCertSha256="${PERMANENT_SIGNING_CERT_SHA256}"

      - name: Stage APK for permanent signing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf signing dist
          mkdir -p signing dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          if [[ -z "${APK}" ]]; then
            echo "arm64-v8a release APK not found. Available files:" >&2
            find app/build/outputs/apk/release -maxdepth 1 -type f -print || true
            exit 1
          fi
          cp "${APK}" signing/Sesame-AG-0.2.2-MultiAccount-arm64-v8a-unsigned.apk

      - name: Sign with permanent certificate
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: signing
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Verify permanent signature and prepare final APK
        shell: bash
        env:
          SIGNED_FILES: ${{ steps.sign_apk.outputs.signedFiles }}
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          if [[ ! -x "${APKSIGNER}" ]]; then
            APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          fi
          [[ -x "${APKSIGNER}" ]] || { echo "apksigner not found" >&2; exit 1; }

          IFS=':' read -r -a signed <<< "${SIGNED_FILES}"
          final_source=""
          for file in "${signed[@]}"; do
            [[ -n "${file}" && -f "${file}" ]] || continue
            if [[ -n "${final_source}" ]]; then
              echo "Expected exactly one signed APK, but multiple files were returned." >&2
              exit 1
            fi
            final_source="${file}"
          done
          [[ -n "${final_source}" ]] || { echo "Signing action returned no APK." >&2; exit 1; }

          cert_output="$("${APKSIGNER}" verify --verbose --print-certs "${final_source}")"
          printf '%s\n' "${cert_output}"
          fingerprint="$(printf '%s\n' "${cert_output}" | awk -F': ' '/certificate SHA-256 digest:/ { digest=$NF; gsub(/:/, "", digest); print toupper(digest); exit }')"
          if [[ "${fingerprint}" != "${PERMANENT_SIGNING_CERT_SHA256}" ]]; then
            echo "Permanent signing certificate mismatch." >&2
            echo "Expected: ${PERMANENT_SIGNING_CERT_SHA256}" >&2
            echo "Actual:   ${fingerprint:-<none>}" >&2
            exit 1
          fi

          cp "${final_source}" "dist/${FINAL_APK_NAME}"
          ls -lh "dist/${FINAL_APK_NAME}"
          sha256sum "dist/${FINAL_APK_NAME}" | tee "dist/${FINAL_APK_NAME}.sha256"
          echo "Permanent certificate verified: ${fingerprint}"

      - name: Upload permanently signed arm64 release
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-0.2.2-MultiAccount-arm64-v8a-permanent-signed
          path: |
            dist/Sesame-AG-0.2.2-MultiAccount-arm64-v8a.apk
            dist/Sesame-AG-0.2.2-MultiAccount-arm64-v8a.apk.sha256
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
