name: Multi Account Fix Build

on:
  push:
    branches:
      - fix/multi-account-0.2.2
    paths:
      - MULTI_ACCOUNT_FIX.patch
      - .github/workflows/multi-account-fix-build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multi-account-fix-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  JAVA_DISTRIBUTION: "oracle"
  JAVA_VERSION: "17.0.1"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  PERMANENT_SIGNING_CERT_SHA256: "7490717E45CA309CCD8A5CF7053A469EBFFB1A8C84B537A84B82BA057FB4E963"

jobs:
  build-arm64-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply multi-account fix
        shell: bash
        run: |
          set -euo pipefail
          if git apply --check MULTI_ACCOUNT_FIX.patch; then
            git apply MULTI_ACCOUNT_FIX.patch
            echo "Multi-account patch applied."
          elif git apply --reverse --check MULTI_ACCOUNT_FIX.patch; then
            echo "Multi-account patch is already applied."
          else
            echo "Patch cannot be applied cleanly and is not already present."
            exit 1
          fi

      - name: Verify intended source changes
        shell: bash
        run: |
          set -euo pipefail
          TARGET='app/src/main/java/io/github/aoguai/sesameag/hook/AccountSlotRegistry.kt'
          grep -F 'record.activeUserIds.size >= MAX_EXECUTABLE_ACCOUNT_SLOTS' "$TARGET"
          grep -F '!hasVerifiedConfiguredUser(userId)' "$TARGET"
          grep -F 'pendingRuntimeUserId in activeUserIds' "$TARGET"

      - name: Configure arm64-v8a only for CI
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE='app/build.gradle.kts'
          sed -i 's/include("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/include("arm64-v8a")/' "$BUILD_FILE"
          sed -i 's/isUniversalApk = true/isUniversalApk = false/' "$BUILD_FILE"
          sed -i '/abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64"))/d' "$BUILD_FILE"
          grep -F 'include("arm64-v8a")' "$BUILD_FILE"
          grep -F 'isUniversalApk = false' "$BUILD_FILE"
          if grep -Fq 'abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64"))' "$BUILD_FILE"; then
            echo "Legacy CI ndk abiFilters are still present."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          architecture: x64
          cache: gradle

      - name: Pin Gradle Java Home
        shell: bash
        run: echo "ORG_GRADLE_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build optimized arm64 release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            :app:assembleRelease \
            -PappVersion=0.2.2-MultiAccount \
            -PofficialSigningCertSha256="${PERMANENT_SIGNING_CERT_SHA256}"

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "arm64-v8a release APK not found. Available files:"
            find app/build/outputs/apk/release -maxdepth 1 -type f -print || true
            exit 1
          fi
          cp "$APK" dist/Sesame-AG-0.2.2-MultiAccount-arm64-v8a.apk
          ls -lh dist/Sesame-AG-0.2.2-MultiAccount-arm64-v8a.apk
          sha256sum dist/Sesame-AG-0.2.2-MultiAccount-arm64-v8a.apk

      - name: Upload arm64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-AG-0.2.2-MultiAccount-arm64-v8a
          path: dist/Sesame-AG-0.2.2-MultiAccount-arm64-v8a.apk
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
